name: Build MidpointBoostFPS

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Распаковка zip-архива мода (если есть) и поиск build.gradle
        id: unpack
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Найден архив: $ZIP_FILE"
            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted
          fi

          GRADLE_FILE=$(find . -name "build.gradle" \
            -not -path "*/.git/*" \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::build.gradle не найден нигде в репозитории после распаковки!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Найден проект в папке: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Установка JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Сборка мода (gradle build)
        working-directory: ${{ steps.unpack.outputs.PROJECT_DIR }}
        run: gradle build --stacktrace --no-daemon

      - name: Публикация собранного .jar как артефакта сборки
        uses: actions/upload-artifact@v4
        with:
          name: midpoint-boost-fps
          path: ${{ steps.unpack.outputs.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
